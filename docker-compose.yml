services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: superior
      POSTGRES_PASSWORD: superior
      POSTGRES_DB: superior_ai
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U superior -d superior_ai"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # Optional: run with profile workers
  # docker compose --profile workers up worker
  worker:
    profiles: ["workers"]
    build:
      context: .
      dockerfile: Dockerfile.worker
    environment:
      DATABASE_URL: postgresql://superior:superior@postgres:5432/superior_ai?schema=public
      REDIS_URL: redis://redis:6379
      SUPERIOR_WORKER: "1"
      WORKER_CONCURRENCY: "2"
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
