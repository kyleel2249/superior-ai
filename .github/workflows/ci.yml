name: CI
on:
  push:
    branches: [main, master]
  pull_request:
jobs:
  smoke:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: superior
          POSTGRES_PASSWORD: superior
          POSTGRES_DB: superior_ai
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U superior -d superior_ai"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://superior:superior@localhost:5432/superior_ai?schema=public
      REDIS_URL: redis://localhost:6379
      AUTH_SECRET: ci-test-secret-not-for-production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm install --ignore-scripts || npm install
      - run: node scripts/smoke.mjs
      - name: pgvector + prisma
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client
          psql "$DATABASE_URL" -f packages/db/prisma/migrations/001_pgvector.sql || true
          npx prisma generate --schema=packages/db/prisma/schema.prisma || true
          npx prisma db push --schema=packages/db/prisma/schema.prisma --skip-generate || true
